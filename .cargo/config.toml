# Cargo configuration for building tutils
#
# Native builds (on same platform):
#   cargo build --release
#
# Static Linux binaries (on Linux):
#   cargo build --release --target x86_64-unknown-linux-musl
#
# Prerequisites (Linux for musl builds):
#   rustup target add x86_64-unknown-linux-musl
#   apt-get install musl-tools  (Debian/Ubuntu)
#   dnf install musl-gcc        (Fedora)
#
# Prerequisites (macOS):
#   Just run: cargo build --release
#   macOS doesn't support fully static binaries
#
# Cross-compilation from macOS to Linux requires additional tooling:
#   brew install filosottile/musl-cross/musl-cross
#   See: https://github.com/AcademySoftwareFoundation/openexr/wiki/Homebrew-Build-Machine-Setup

# =============================================================================
# Linux musl (fully static binary) - ONLY for native Linux builds
# For cross-compilation from macOS, use a Docker container or CI/CD
# =============================================================================
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
]

[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
]

# =============================================================================
# macOS - No special flags needed
# Note: macOS always produces dynamic binaries (links to libSystem.dylib)
# =============================================================================
# [target.x86_64-apple-darwin]
# [target.aarch64-apple-darwin]
# No flags - use defaults

# =============================================================================
# Build settings
# =============================================================================
[build]
# Uncomment to set default target for your platform:
# target = "x86_64-unknown-linux-musl"

[alias]
# Build aliases
static-linux = "build --release --target x86_64-unknown-linux-musl"
static-linux-arm = "build --release --target aarch64-unknown-linux-musl"

# Build all binaries for current platform
all = "build --release --workspace"
