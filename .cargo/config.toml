# Cargo configuration for static binary compilation
#
# Build static binaries:
#   Linux:  cargo build --release --target x86_64-unknown-linux-musl
#   macOS:  cargo build --release --target x86_64-apple-darwin (or aarch64-apple-darwin)
#
# Prerequisites (Linux):
#   rustup target add x86_64-unknown-linux-musl
#   apt-get install musl-tools  (Debian/Ubuntu)
#   dnf install musl-gcc        (Fedora)
#
# Prerequisites (macOS):
#   rustup target add x86_64-apple-darwin aarch64-apple-darwin

# =============================================================================
# Linux musl (fully static binary)
# =============================================================================
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-self-contained=yes",
]

[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-self-contained=yes",
]

# =============================================================================
# Linux GNU (dynamic build - for development)
# Note: GNU target doesn't support fully static builds easily.
# Use musl target for static binaries.
# =============================================================================
# [target.x86_64-unknown-linux-gnu]
# rustflags = []
#
# [target.aarch64-unknown-linux-gnu]
# rustflags = []

# =============================================================================
# macOS (static linking where possible)
# Note: macOS doesn't support fully static binaries, but we minimize dynamic deps
# =============================================================================
[target.x86_64-apple-darwin]
rustflags = [
    "-C", "target-feature=+crt-static",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "target-feature=+crt-static",
]

# =============================================================================
# Build settings
# =============================================================================
[build]
# Uncomment to set default target for your platform:
# target = "x86_64-unknown-linux-musl"

[env]
# Use rustls instead of native-tls to avoid OpenSSL dependency
CARGO_FEATURE_RUSTLS_TLS = "1"

[alias]
# Convenience aliases for static builds
static-linux = "build --release --target x86_64-unknown-linux-musl"
static-linux-arm = "build --release --target aarch64-unknown-linux-musl"
static-macos = "build --release --target x86_64-apple-darwin"
static-macos-arm = "build --release --target aarch64-apple-darwin"

# Build all binaries
all = "build --release --workspace"
